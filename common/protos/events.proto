syntax = "proto3";

package events;

service EventService {
  rpc CreateEvent(CreateEventRequest) returns (EventResponse);
  rpc GetEvent(GetEventRequest) returns (EventResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc UpdateEvent(UpdateEventRequest) returns (EventResponse);
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);
  rpc ReserveSeat(ReserveSeatRequest) returns (ReserveSeatResponse);
}

message CreateEventRequest {
  string title = 1;
  string description = 2;
  string event_date = 3;
  string location = 4;
  int32 total_tickets = 5;
  int32 price_cents = 6;
}

message GetEventRequest {
  int64 event_id = 1;
}

message ListEventsRequest {}

message UpdateEventRequest {
  int64 event_id = 1;
  string title = 2;
  string description = 3;
  string event_date = 4;
  string location = 5;
  int32 total_tickets = 6;
  int32 price_cents = 7;
}

message DeleteEventRequest {
  int64 event_id = 1;
}

message DeleteEventResponse {
  bool deleted = 1;
}

message ReserveSeatRequest {
  int64 event_id = 1;
}

message EventResponse {
  int64 id = 1;
  string title = 2;
  string description = 3;
  string event_date = 4;
  string location = 5;
  int32 total_tickets = 6;
  int32 available_tickets = 7;
  int32 price_cents = 8;
}

message ListEventsResponse {
  repeated EventResponse events = 1;
}

message ReserveSeatResponse {
  bool reserved = 1;
  int32 available_tickets = 2;
}