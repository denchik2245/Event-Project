<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EventFlow | Оплата</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body data-page="payment">
    <header class="site-head">
      <a class="logo" href="/visitor">EventFlow</a>
      <nav>
        <a href="/visitor">Посетителю</a>
        <a href="/organizer">Организатору</a>
      </nav>
    </header>

    <main class="page payment-page">
      <section class="notice" id="notice" aria-live="polite">Загрузка билета...</section>

      <article class="surface payment-card">
        <div class="section-title">
          <span>Оплата билета</span>
          <h1 id="paymentTitle">Мероприятие</h1>
        </div>
        <dl id="paymentDetails" class="details"></dl>
        <button id="payButton" type="button">Оплатить</button>
      </article>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
